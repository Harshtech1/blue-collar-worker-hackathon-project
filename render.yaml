# RAHI_BLUE_Collar — Docker-only blueprint for Render
services:
  - type: web
    name: RAHI-APP-Docker
    env: docker
    repo: https://github.com/Harshtech1/blue-collar-worker-hackathon-project
    branch: main
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: CLIENT_URL
        value: https://blue-collar-worker-hackathon-projec.vercel.app,http://localhost:5173
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANALYTICS_SERVICE_URL
        fromService:
          type: web
          name: rahi-analytics-service
          property: hostport
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false

  - type: web
    name: rahi-analytics-service
    env: docker
    repo: https://github.com/Harshtech1/blue-collar-worker-hackathon-project
    branch: main
    dockerfilePath: react/app/microservices/analytics-service/Dockerfile
    dockerContext: react/app/microservices/analytics-service
    plan: free
    envVars:
      - key: PORT
        value: 8000
